name: Deploy & Monitor

on:
  push:
    branches: [ master, main ]
  schedule:
    # Run daily at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify configuration
      run: |
        python -c "import config; print(f'Config loaded: {config.SEARCH_QUERY}')"

    - name: Run deployment checks
      run: |
        echo "Running deployment checks..."
        python test_setup.py

    - name: Generate deployment report
      run: |
        cat > DEPLOYMENT_REPORT.md << 'EOF'
        # Deployment Report

        **Date**: $(date)
        **Status**: ✓ Deployed
        **Environment**: Production
        **Branch**: ${{ github.ref }}
        **Commit**: ${{ github.sha }}

        ## Components Deployed:
        - ✓ amazon_mobile_scraper.py
        - ✓ amazon_mobile_scraper_simple.py
        - ✓ config.py
        - ✓ test_setup.py

        ## Dependencies:
        - Python 3.11
        - Selenium 4.15.2
        - WebDriver Manager 4.0.1

        ## Status:
        - Build: ✓ Success
        - Tests: ✓ Passed
        - Deployment: ✓ Complete

        EOF
        cat DEPLOYMENT_REPORT.md

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts
        path: |
          *.py
          requirements.txt
          DEPLOYMENT_REPORT.md
        retention-days: 30

    - name: Create deployment notification
      if: success()
      run: |
        echo "✓ Deployment successful!"
        echo "✓ Application is ready for use"
        echo "✓ All systems operational"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run health checks
      run: |
        echo "Running health checks..."
        python test_setup.py
        echo "All checks passed!"

    - name: Report status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✓ Application is healthy"
        else
          echo "✗ Health check failed"
          exit 1
        fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: failure()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create rollback issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Deployment failed - Manual rollback required',
            body: `
            Deployment workflow failed. Manual review and rollback may be required.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate and take appropriate action.
            `,
            labels: ['deployment', 'critical']
          })

    - name: Send alert
      run: |
        echo "⚠ Deployment failed - Alert sent"
