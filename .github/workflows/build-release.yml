name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine

    - name: Run tests
      run: |
        pip install -r requirements.txt
        python test_setup.py

    - name: Create distribution
      run: |
        mkdir -p dist
        cp -r *.py dist/
        cp -r *.md dist/
        cp -r *.txt dist/
        cp requirements.txt dist/

    - name: Create tarball
      run: |
        cd dist
        tar -czf amazon-mobile-scraper.tar.gz *.py *.md *.txt requirements.txt
        cd ..

    - name: Create zip archive
      run: |
        cd dist
        zip -r amazon-mobile-scraper.zip *.py *.md *.txt requirements.txt
        cd ..

    - name: Display build artifacts
      run: |
        ls -lh dist/
        echo "---"
        du -sh dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: dist/
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          # Amazon Mobile Scraper Release

          Automated release from GitHub Actions

          ## Files included:
          - amazon_mobile_scraper.py - Main scraper
          - amazon_mobile_scraper_simple.py - Simple version
          - config.py - Configuration
          - requirements.txt - Dependencies
          - Documentation files
          - Sample data (JSON & CSV)

          ## Installation:
          ```bash
          pip install -r requirements.txt
          python amazon_mobile_scraper.py
          ```

          See README.md for complete documentation.
        draft: false
        prerelease: false

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/amazon-mobile-scraper.tar.gz
          dist/amazon-mobile-scraper.zip
          mobile_results.json
          mobile_results.csv
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate documentation index
      run: |
        cat > DOCUMENTATION.md << 'EOF'
        # Amazon Mobile Scraper - Complete Documentation

        ## Quick Links
        - [README](README.md) - Project overview
        - [Setup Guide](SETUP.md) - Installation instructions
        - [Project Summary](PROJECT_SUMMARY.md) - Detailed project info
        - [Workflow Diagrams](WORKFLOW.md) - Visual guides
        - [Test Results](TEST_RESULTS.md) - Test details
        - [Final Report](FINAL_REPORT.md) - Comprehensive report
        - [Quick Start](QUICK_START.txt) - Quick reference

        ## Files
        - `amazon_mobile_scraper.py` - Full-featured scraper
        - `amazon_mobile_scraper_simple.py` - Simple version
        - `config.py` - Configuration settings
        - `test_setup.py` - Setup verification

        ## Running the scraper
        ```bash
        python amazon_mobile_scraper.py
        ```

        Generated documentation index.
        EOF

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: '*.md'
        retention-days: 30
